[project]
name = "plugai-trade"
version = "1.0.0"
description = "PlugAI-Trade: the free companion lab for the book 'Trading with AI – For All Levels'. Research, plan, paper-trade and review — India & US. Paper only: it never places real orders."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Bhanu Mahesh" }]
requires-python = ">=3.11"
keywords = ["trading", "ai", "llm", "backtesting", "paper-trading", "nse", "india", "education"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Education",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "streamlit>=1.40",
  "typer>=0.12",
  "polars>=1.0",
  "pandas>=2.1",
  "numpy>=1.26",
  "altair>=5",
  "httpx>=0.27",
  "pyyaml>=6",
  "keyring>=25",
  "pypdf>=4",
  "mcp>=1.2",
  "pyarrow>=15",
  "cryptography>=42",
  "feedparser>=6",
]

[project.optional-dependencies]
cloud = ["litellm>=1.50"]
yahoo = ["yfinance>=0.2.50"]
crypto = ["ccxt>=4"]
ml = ["scikit-learn>=1.4"]
all = ["litellm>=1.50", "yfinance>=0.2.50", "ccxt>=4", "scikit-learn>=1.4"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
plugai-trade = "plugai_trade.cli:app"

[project.urls]
Homepage = "https://github.com/bhanumahesh1993/plugai-trade"
Book = "https://github.com/bhanumahesh1993/plugai-trade#the-book"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plugai_trade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
